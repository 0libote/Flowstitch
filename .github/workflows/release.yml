name: Release Obsidian plugin

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify checks and audit before build
        run: |
          npm run check
          npm audit --audit-level=moderate
          npm run guidelines

      - name: Validate tag matches manifest.json version
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          manifest="$(node -p "require('./manifest.json').version")"
          expected="v${manifest}"
          if [ "$tag" != "$expected" ]; then
            echo "Tag $tag does not match manifest.json version $manifest (expected $expected)"
            exit 1
          fi

      - name: Package plugin
        run: npm run package

      - name: Check for optional styles
        id: styles
        run: |
          [ -f styles.css ] && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"

          # SHA256SUMS documents expected hashes; attach it alongside the
          # installable ZIP. Individual main.js/manifest.json/styles.css
          # assets are attached for the Obsidian release flow.
          gh release create "$tag" \
            --title="$tag" \
            --draft \
            main.js manifest.json ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }} dist/SHA256SUMS.json "dist/flowstitch-${tag#v}.zip"
